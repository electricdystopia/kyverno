# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Kyvernaut documentation retrieval

on:
  workflow_dispatch:
    inputs:
      question:
        description: Question to retrieve trusted repository documentation for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kyvernaut-docs-qa-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  retrieve:
    name: Retrieve citation-backed documentation
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check repository kill switch
        id: pause
        shell: bash
        env:
          PAUSE_VALUE: ${{ vars.KYVERNAUT_PAUSED }}
        run: |
          value="${PAUSE_VALUE//[[:space:]]/}"
          value="${value,,}"
          case "$value" in
            1|true|yes|on) echo "paused=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "paused=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Checkout exact trusted default-branch commit
        if: steps.pause.outputs.paused != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        if: steps.pause.outputs.paused != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kyvernaut/requirements-runtime.txt

      - name: Install hash-locked runtime dependency
        if: steps.pause.outputs.paused != 'true'
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          --requirement kyvernaut/requirements-runtime.txt

      - name: Retrieve trusted documentation as data
        if: steps.pause.outputs.paused != 'true'
        env:
          KYVERNAUT_QUESTION: ${{ inputs.question }}
          SOURCE_URL_PREFIX: >-
            ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
        run: |
          python kyvernaut/qa_retrieval.py \
            --repo . \
            --question-env KYVERNAUT_QUESTION \
            --source-url-prefix "$SOURCE_URL_PREFIX" \
            --output-dir "$RUNNER_TEMP/kyvernaut-docs-qa"

      - name: Upload immutable retrieval audit
        if: always() && steps.pause.outputs.paused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kyvernaut-docs-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/kyvernaut-docs-qa
          retention-days: 30
