# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Kyvernaut PR advisor

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

# The advisor only reads repository/check metadata and creates or updates its
# own PR comment. It never receives contents:write or any merge-related token.
permissions:
  checks: read
  contents: read
  pull-requests: write

concurrency:
  group: kyvernaut-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  advise:
    name: Comment-only shadow evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check repository kill switch
        id: pause
        shell: bash
        env:
          PAUSE_VALUE: ${{ vars.KYVERNAUT_PAUSED }}
        run: |
          value="${PAUSE_VALUE//[[:space:]]/}"
          value="${value,,}"
          case "$value" in
            1|true|yes|on) echo "paused=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "paused=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # pull_request_target has a write-capable token. Always execute the
      # trusted default-branch implementation, never the pull request head.
      - name: Checkout trusted default branch
        if: steps.pause.outputs.paused != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        if: steps.pause.outputs.paused != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: kyvernaut/requirements-runtime.txt

      - name: Install runtime dependency
        if: steps.pause.outputs.paused != 'true'
        run: >-
          python -m pip install
          --only-binary=:all:
          --require-hashes
          --requirement kyvernaut/requirements-runtime.txt

      - name: Collect PR evidence without shell interpolation
        if: steps.pause.outputs.paused != 'true'
        id: evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FILES_JSON: ${{ runner.temp }}/kyvernaut-files.json
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });
            fs.writeFileSync(process.env.FILES_JSON, JSON.stringify(files));

            const refreshed = await github.rest.pulls.get({ owner, repo, pull_number });
            const supportedMergeableStates = new Set([
              "behind",
              "blocked",
              "clean",
              "dirty",
              "unstable",
            ]);
            const mergeableState = supportedMergeableStates.has(refreshed.data.mergeable_state)
              ? refreshed.data.mergeable_state
              : "unknown";

            const checks = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: context.payload.pull_request.head.sha,
              per_page: 100,
            });
            const bad = new Set([
              "action_required",
              "cancelled",
              "failure",
              "stale",
              "startup_failure",
              "timed_out",
            ]);
            let ciState = "unknown";
            if (checks.length > 0) {
              if (checks.some((check) => check.status !== "completed")) {
                ciState = "pending";
              } else if (checks.some((check) => bad.has(check.conclusion))) {
                ciState = "failure";
              } else {
                ciState = "success";
              }
            }
            core.setOutput("ci-state", ciState);
            core.setOutput("mergeable-state", mergeableState);

      - name: Generate scope, decision, and comment
        if: steps.pause.outputs.paused != 'true'
        id: report
        env:
          KYVERNAUT_PAUSED: ${{ vars.KYVERNAUT_PAUSED }}
        run: |
          python kyvernaut/pr_shadow.py \
            --event "$GITHUB_EVENT_PATH" \
            --files-json "$RUNNER_TEMP/kyvernaut-files.json" \
            --output-dir "$RUNNER_TEMP/kyvernaut-audit" \
            --ci-state "${{ steps.evidence.outputs.ci-state }}" \
            --mergeable-state "${{ steps.evidence.outputs.mergeable-state }}" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload immutable audit evidence
        if: steps.pause.outputs.paused != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kyvernaut-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ runner.temp }}/kyvernaut-audit
          retention-days: 30

      - name: Create or update the advisory comment
        if: >-
          steps.pause.outputs.paused != 'true' &&
          steps.report.outputs.assistant_enabled == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_PATH: ${{ runner.temp }}/kyvernaut-audit/comment.md
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- kyvernaut:pr-advisor:v1 -->";
            const body = fs.readFileSync(process.env.COMMENT_PATH, "utf8");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
