# Machine-readable index of stable developer tasks.
version: 1

tasks:
  - id: tools-install
    category: setup
    argv: [make, install-tools]
    description: Install repository-pinned development tools into .tools.
    automation: review
    mutates_worktree: true
    destructive: false
    requires_network: true
    requires_cluster: false

  - id: tools-clean
    category: setup
    argv: [make, clean-tools]
    description: Remove repository-local development tools.
    automation: never
    mutates_worktree: true
    destructive: true
    requires_network: false
    requires_cluster: false

